[project]
name = "nie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hitesh Chandwani", email = "hit1993esh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.2",
    "asyncpg>=0.31.0",
    "fastembed>=0.8.0",
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
    "openai>=3.13.0",
    "pgvector>=0.5.0",
    "pydantic-settings>=2.15.0",
    "resend>=2.44.0",
    "sqlalchemy[asyncio]>=2.0",
    "trafilatura>=2.2.0",
]

[project.scripts]
nie = "nie:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "alembic"]

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
