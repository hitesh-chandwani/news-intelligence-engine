[project]
name = "nie"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Hitesh Chandwani", email = "hit1993esh@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
nie = "nie:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
