<div id="preferences-form-wrapper">
  <form
    hx-patch="/preferences"
    hx-target="#preferences-form-wrapper"
    hx-swap="outerHTML"
    hx-ext="json-enc"
  >
    <label>
      Minimum importance
      <select name="min_importance">
        {% for value in ["low", "medium", "high", "critical"] %}
        <option value="{{ value }}" {% if preference.min_importance == value %}selected{% endif %}>
          {{ value }}
        </option>
        {% endfor %}
      </select>
    </label>

    <fieldset>
      <legend>Categories (none selected means all categories)</legend>
      <!--
        Hidden fallback: htmx's json-enc extension omits an unchecked
        checkbox from the submitted values entirely, so unchecking every
        box below would otherwise drop "categories" from the PATCH body
        altogether (a no-op, since PreferenceUpdate treats a missing
        field as "leave unchanged") instead of clearing it to []. This
        keeps the key present even then; PreferenceUpdate's
        _normalize_checkbox_group validator (src/nie/schemas.py) drops
        this empty-string entry back out, alone or mixed with real
        checked values.
      -->
      <input type="hidden" name="categories" value="" />
      {% for category in categories %}
      <label>
        <input
          type="checkbox"
          name="categories"
          value="{{ category.slug }}"
          {% if category.slug in preference.categories %}checked{% endif %}
        />
        {{ category.name }}
      </label>
      {% endfor %}
    </fieldset>

    <fieldset>
      <legend>Channels</legend>
      <!-- Same hidden-fallback reasoning as the categories fieldset above. -->
      <input type="hidden" name="channels" value="" />
      {% for channel in ["telegram", "email", "inapp"] %}
      <label>
        <input
          type="checkbox"
          name="channels"
          value="{{ channel }}"
          {% if channel in preference.channels %}checked{% endif %}
        />
        {{ channel }}
      </label>
      {% endfor %}
    </fieldset>

    <button type="submit">Save preferences</button>
  </form>
</div>
